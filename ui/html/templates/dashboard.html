{{define "main"}}
<div class="grid">
{{range .}}
    <div class="card">
        <div class="card-top">
            <div class="coin-row">
                <div class="coin-icon">$</div>
                <div>
                    <div class="coin-name">{{.Coin}}</div>
                    <div class="coin-ticker">{{slice .Coin 0 3}}</div>
                </div>
            </div>
            <div class="exchange-badge">{{.Exchange}}</div>
        </div>
        <div class="price-label">precio actual</div>
        <div class="price">
            ${{printf "%.2f" .Value}}<span class="price-currency">MXN</span>
        </div>
        <hr class="card-divider">
        <div class="card-meta">
            <span class="meta-label">moneda</span>
            <span class="meta-value">{{if .Currency}}{{.Currency}}{{else}}MXN{{end}}</span>
        </div>
    </div>
{{end}}
</div>
{{end}}
