{{define "base"}}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta http-equiv="content-type" content="text/html;charset=utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CryptoMonitor</title>
        <link rel="stylesheet" href="/static/css/main.css">
    </head>
    <body>
        <div class="container">
            <div class="header">
                <div class="header-title">CryptoMonitor</div>
                <div class="header-updated">última actualización: {{template "updated" .}}</div>
            </div>
            <main>
                {{template "main" .}}
            </main>
            <div class="footer">
                <span class="footer-text">Hecho con <a href="https://go.dev/">Go</a></span>
                <form method="POST" action="/refresh" style="margin:0">
                    <button class="btn-refresh" type="submit">↻ actualizar</button>
                </form>
            </div>
        </div>
    </body>
</html>
{{end}}

{{define "updated"}}{{with index . 0}}{{.LastUpdated.Format "2006-01-02 15:04:05"}}{{end}}{{end}}
